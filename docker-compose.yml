# Local development stack: docker compose up --build
# Api: http://localhost:8080 (Scalar UI at /scalar)

x-app-environment: &app-environment
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=videoprocessor;Username=videoprocessor;Password=videoprocessor
  # Azurite's well-known development account key, not a secret.
  ConnectionStrings__BlobStorage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: videoprocessor
      POSTGRES_USER: videoprocessor
      POSTGRES_PASSWORD: videoprocessor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoprocessor -d videoprocessor"]
      interval: 2s
      timeout: 5s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      <<: *app-environment
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    environment:
      <<: *app-environment
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  postgres-data:
  azurite-data:
